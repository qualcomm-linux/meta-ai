name: Test OpenEmbedded distro

on:
  workflow_call:
    inputs:
      build_id:
        description: Workflow run containing build URL artifacts
        required: true
        type: string
      devices:
        description: Comma-separated LAVA device types
        required: true
        type: string
      devices_premerge:
        description: Comma-separated devices for pre-merge tests
        required: true
        type: string
      distro_name:
        description: Distro name used in build URL artifact names
        required: true
        type: string
      lava_test_plans_ref:
        description: Commit in qualcomm-linux/lava-test-plans
        required: true
        type: string
      testkit_ref:
        description: Revision in qualcomm-linux/qcom-linux-testkit
        required: true
        type: string
      project_name:
        description: Project namespace in lava-test-plans
        required: true
        type: string
      pr_number:
        description: Pull request number recorded in LAVA metadata
        required: false
        type: string
      pr_url:
        description: Pull request URL recorded in LAVA metadata
        required: false
        type: string
    outputs:
      summary_id:
        description: Artifact ID containing the LAVA summary
        value: ${{ jobs.publish-test-summary.outputs.summary_id }}
    secrets:
      LAVATOKEN:
        description: Token used to submit jobs to LAVA
        required: true

permissions: {}

jobs:
  prepare-boot-jobs:
    name: Prepare boot jobs
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      artifact_id: ${{ steps.lava-test-plans.outputs.artifact_id }}
      jobmatrix: ${{ steps.lava-test-plans.outputs.jobmatrix }}
    steps:
      - name: Render boot jobs
        id: lava-test-plans
        uses: qualcomm-linux/meta-qcom/.github/actions/lava-test-plans@f00721cb5468349e1cc978087b8a8d5d57ae5a60
        with:
          machines: ${{ inputs.devices }}
          distro_name: ${{ inputs.distro_name }}
          build_id: ${{ inputs.build_id }}
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          prefix: boottest
          project: ${{ inputs.project_name }}
          testplan: ${{ inputs.distro_name }}/boot
          ref: ${{ inputs.lava_test_plans_ref }}
          testkit_ref: ${{ inputs.testkit_ref }}
          pr_number: ${{ inputs.pr_number }}
          pr_url: ${{ inputs.pr_url }}

      - name: Require rendered boot jobs
        env:
          ARTIFACT_ID: ${{ steps.lava-test-plans.outputs.artifact_id }}
          JOB_MATRIX: ${{ steps.lava-test-plans.outputs.jobmatrix }}
        run: |
          test -n "$ARTIFACT_ID"
          test -n "$JOB_MATRIX"
          test "$(jq '.target | length' <<< "$JOB_MATRIX")" -gt 0

  submit-boot-job:
    name: Boot ${{ matrix.target.name }}
    needs: prepare-boot-jobs
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-boot-jobs.outputs.jobmatrix) }}
    steps:
      - name: Download rendered jobs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prepare-boot-jobs.outputs.artifact_id }}

      - name: Submit boot job
        id: submit
        timeout-minutes: 120
        uses: foundriesio/lava-action@3d40f621e0cd5acec50f557783b755f278ca892d # v13
        with:
          lava_token: ${{ secrets.LAVATOKEN }}
          lava_url: https://lava.infra.foundries.io
          job_definition: ${{ matrix.target.path }}
          wait_for_job: true
          fail_action_on_failure: true
          fail_action_on_incomplete: true
          save_result_as_artifact: true
          save_job_details: true
          result_file_name: ${{ matrix.target.result_file }}
          test_job_file_name_prefix: ${{ inputs.distro_name }}-

      - name: Record boot result
        if: always()
        uses: qualcomm-linux/github-action-matrix-outputs-write@59fdd8db9c91b623ec1111b9c081435b1533f529 # v3
        with:
          matrix-step-name: submit-boot-job-${{ inputs.distro_name }}
          matrix-key: ${{ matrix.target.name }}-${{ inputs.distro_name }}
          artifact-name: submit-boot-job-${{ inputs.distro_name }}-${{ matrix.target.name }}
          outputs: |
            result: ${{ steps.submit.outcome }}

  boot-job-result:
    name: Require boot jobs
    needs: submit-boot-job
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      result: ${{ steps.result.outputs.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read boot results
        id: matrix
        uses: qualcomm-linux/github-action-matrix-outputs-read@2b2498aa0fc6c565e02af0f3a3c5b7e1b6ae07f4
        with:
          matrix-step-name: submit-boot-job-${{ inputs.distro_name }}
          download-file-pattern: submit-boot-job-${{ inputs.distro_name }}-*

      - name: Require successful boot jobs
        id: result
        env:
          MATRIX_RESULTS: ${{ steps.matrix.outputs.result }}
        run: |
          ci/assert-matrix-results.py
          echo "result=success" >> "$GITHUB_OUTPUT"

  prepare-premerge-jobs:
    name: Prepare pre-merge jobs
    needs: boot-job-result
    if: needs.boot-job-result.outputs.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      artifact_id: ${{ steps.lava-test-plans.outputs.artifact_id }}
      jobmatrix: ${{ steps.lava-test-plans.outputs.jobmatrix }}
    steps:
      - name: Render pre-merge jobs
        id: lava-test-plans
        uses: qualcomm-linux/meta-qcom/.github/actions/lava-test-plans@f00721cb5468349e1cc978087b8a8d5d57ae5a60
        with:
          machines: ${{ inputs.devices_premerge }}
          distro_name: ${{ inputs.distro_name }}
          build_id: ${{ inputs.build_id }}
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          prefix: premerge
          project: ${{ inputs.project_name }}
          testplan: ${{ inputs.distro_name }}/pre-merge
          ref: ${{ inputs.lava_test_plans_ref }}
          testkit_ref: ${{ inputs.testkit_ref }}
          pr_number: ${{ inputs.pr_number }}
          pr_url: ${{ inputs.pr_url }}

      - name: Require rendered pre-merge jobs
        env:
          ARTIFACT_ID: ${{ steps.lava-test-plans.outputs.artifact_id }}
          JOB_MATRIX: ${{ steps.lava-test-plans.outputs.jobmatrix }}
        run: |
          test -n "$ARTIFACT_ID"
          test -n "$JOB_MATRIX"
          test "$(jq '.target | length' <<< "$JOB_MATRIX")" -gt 0

  submit-premerge-job:
    name: Pre-merge ${{ matrix.target.name }}
    needs: prepare-premerge-jobs
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-premerge-jobs.outputs.jobmatrix) }}
    steps:
      - name: Download rendered jobs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prepare-premerge-jobs.outputs.artifact_id }}

      - name: Submit pre-merge job
        id: submit
        timeout-minutes: 120
        uses: foundriesio/lava-action@3d40f621e0cd5acec50f557783b755f278ca892d # v13
        with:
          lava_token: ${{ secrets.LAVATOKEN }}
          lava_url: https://lava.infra.foundries.io
          job_definition: ${{ matrix.target.path }}
          wait_for_job: true
          fail_action_on_failure: true
          fail_action_on_incomplete: true
          save_result_as_artifact: true
          save_job_details: true
          result_file_name: ${{ matrix.target.result_file }}
          test_job_file_name_prefix: ${{ inputs.distro_name }}-

      - name: Record pre-merge result
        if: always()
        uses: qualcomm-linux/github-action-matrix-outputs-write@59fdd8db9c91b623ec1111b9c081435b1533f529 # v3
        with:
          matrix-step-name: submit-premerge-job-${{ inputs.distro_name }}
          matrix-key: ${{ matrix.target.name }}-${{ inputs.distro_name }}
          artifact-name: submit-premerge-job-${{ inputs.distro_name }}-${{ matrix.target.name }}
          outputs: |
            result: ${{ steps.submit.outcome }}

  premerge-job-result:
    name: Require pre-merge jobs
    needs: submit-premerge-job
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read pre-merge results
        id: matrix
        uses: qualcomm-linux/github-action-matrix-outputs-read@2b2498aa0fc6c565e02af0f3a3c5b7e1b6ae07f4
        with:
          matrix-step-name: submit-premerge-job-${{ inputs.distro_name }}
          download-file-pattern: submit-premerge-job-${{ inputs.distro_name }}-*

      - name: Require successful pre-merge jobs
        env:
          MATRIX_RESULTS: ${{ steps.matrix.outputs.result }}
        run: ci/assert-matrix-results.py

  publish-test-summary:
    name: Publish LAVA summary
    needs: [boot-job-result, premerge-job-result]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      summary_id: ${{ steps.summary.outputs.artifact_id }}
    steps:
      - name: Generate summary
        id: summary
        uses: qualcomm-linux/meta-qcom/.github/actions/test-job-summary@f00721cb5468349e1cc978087b8a8d5d57ae5a60
        with:
          build_id: ${{ github.run_id }}
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          prefix: ${{ inputs.distro_name }}-test-job*
          summary_file_name: ${{ inputs.distro_name }}-test-job-summary
          summary_title: ${{ inputs.distro_name }}

      - name: Publish summary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.summary.outputs.artifact_id }}

      - name: Add summary to run
        run: cat "${{ inputs.distro_name }}-test-job-summary" >> "$GITHUB_STEP_SUMMARY"

  test-successful:
    name: LAVA tests successful
    needs: [boot-job-result, premerge-job-result, publish-test-summary]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require every test stage
        env:
          BOOT_RESULT: ${{ needs.boot-job-result.result }}
          PREMERGE_RESULT: ${{ needs.premerge-job-result.result }}
          SUMMARY_RESULT: ${{ needs.publish-test-summary.result }}
        run: |
          ci/assert-job-results.sh \
            "boot=${BOOT_RESULT}" \
            "pre-merge=${PREMERGE_RESULT}" \
            "summary=${SUMMARY_RESULT}"
