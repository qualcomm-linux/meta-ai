name: Build on PR
run-name: "${{ github.base_ref }}: ${{ github.event.pull_request.title }}"

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'README'
      - 'SECURITY.md'

permissions:
  contents: read

jobs:
  fork-policy:
    name: Fork build policy
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Require a repository branch
        run: |
          echo "OpenEmbedded builds do not execute fork code on Qualcomm self-hosted runners."
          echo "A maintainer must reproduce the change on a branch in ${GITHUB_REPOSITORY}."
          exit 1

  pr-to-workflow-dependency:
    name: "PR to workflow dependency"
    permissions:
      actions: read
      contents: read
      pull-requests: read
    uses: qualcomm/qcom-reusable-workflows/.github/workflows/qswat-reusable-pr-to-workflow-dependency.yml@0f1b47d0eb808a4a2142db40bf3d86becc8c02da
    with:
      workflow_id: ${{ github.run_id }}
      run_attempt: ${{ github.run_attempt }}
      pr_number: ${{ github.event.pull_request.number }}

  build-pr:
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      actions: read
      contents: read
      packages: read
    uses: ./.github/workflows/build-openembedded.yml
