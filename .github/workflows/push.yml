name: Build on push
run-name: "${{ github.ref_name }}: ${{ github.event.head_commit.message }}"

on:
  push:
    branches:
      - main
      - wrynose
      # Temporary branch keeps the standalone build loop testable before merge.
      - koenkooi-ci-lava-proposal

permissions:
  contents: read

jobs:
  build:
    permissions:
      actions: read
      contents: read
      packages: read
    uses: ./.github/workflows/build-openembedded.yml

  ci-successful:
    name: Build successful
    needs: build
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require every CI stage
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          ci/assert-job-results.sh \
            "build=${BUILD_RESULT}"
