name: Test PR build
run-name: "LAVA: ${{ github.event.workflow_run.display_title }}"

on:
  # The build executes PR code without LAVA or reporting secrets. This trusted
  # base-branch workflow consumes only its event and build URL artifacts.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: ["Build on PR"]
    types: [completed]

concurrency:
  group: test-pr-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  determine-target:
    name: Determine PR target
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      branch: ${{ steps.event.outputs.branch }}
      head_sha: ${{ steps.event.outputs.head_sha }}
      pr_number: ${{ steps.event.outputs.pr_number }}
      pr_url: ${{ steps.event.outputs.pr_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download originating event
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Event File
          path: originating-event
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Resolve pull request
        id: event
        run: ci/resolve-pr-event.py originating-event/event.json

  test:
    name: Run LAVA tests
    needs: determine-target
    if: github.event.workflow_run.conclusion == 'success' && needs.determine-target.outputs.branch == 'main'
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/test.yml
    secrets:
      LAVATOKEN: ${{ secrets.LAVATOKEN }}
    with:
      build_id: ${{ github.event.workflow_run.id }}
      pr_number: ${{ needs.determine-target.outputs.pr_number }}
      pr_url: ${{ needs.determine-target.outputs.pr_url }}

  comment:
    name: Comment on PR
    needs: [determine-target, test]
    if: always() && needs.test.outputs.summary_id != ''
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download LAVA summary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.test.outputs.summary_id }}
          path: results-summary

      - name: Render comment
        env:
          HEAD_SHA: ${{ needs.determine-target.outputs.head_sha }}
        run: |
          ci/render-lava-comment.py \
            --commit "$HEAD_SHA" \
            --output pr-comment.md \
            --summary-dir results-summary \
            --workflow-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Update test comment
        uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b # v3
        with:
          file-path: pr-comment.md
          pr-number: ${{ needs.determine-target.outputs.pr_number }}
          comment-tag: lava-test-results

  publish:
    name: Publish test results
    needs: [determine-target, test]
    if: always() && needs.test.result != 'skipped'
    permissions:
      actions: read
      checks: write
      contents: read
      pull-requests: write
    uses: ./.github/workflows/publish-results.yml
    secrets:
      TEST_REPORTING_APP_TOKEN: ${{ secrets.TEST_REPORTING_APP_TOKEN }}
    with:
      commit: ${{ needs.determine-target.outputs.head_sha }}
      event_file: artifacts/Event File/event.json
      event_name: pull_request
      workflow_id: ${{ github.event.workflow_run.id }}

  test-pr-successful:
    name: PR LAVA successful
    needs: [determine-target, test, comment, publish]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require testing and reporting
        env:
          COMMENT_RESULT: ${{ needs.comment.result }}
          DETERMINE_RESULT: ${{ needs.determine-target.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          ci/assert-job-results.sh \
            "determine-target=${DETERMINE_RESULT}" \
            "test=${TEST_RESULT}" \
            "comment=${COMMENT_RESULT}" \
            "publish=${PUBLISH_RESULT}"
